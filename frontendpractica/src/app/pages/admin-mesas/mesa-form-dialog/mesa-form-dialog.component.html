<h2 mat-dialog-title>Nueva mesa</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Número de mesa</mat-label>
      <input matInput type="number" formControlName="numero" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Capacidad (comensales)</mat-label>
      <input matInput type="number" formControlName="capacidad" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="null">Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Crear</button>
  </mat-dialog-actions>
</form>
